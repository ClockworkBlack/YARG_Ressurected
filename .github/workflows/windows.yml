name: Build Windows

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "putudarma/YARG-DROID commit to build on (keep the same as the Android build)"
        default: "9bebad16e63cde7022a1fb7b261b541c1fae5361"
        required: true
  push:
    # Windows work branch too, so it builds before the workflow is on main
    branches: [main, ccr-cb2b20e6-xf3265]
    paths:
      - "patches/**"
      - "patches-core/**"
      - "overlay/**"
      - "windows/**"
      - "tests/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

env:
  # Same game as the Android build: YARG-DROID (YARG v0.15.0) + this repo's patches and overlay.
  # windows/prepare-project.sh adds back the Windows native libraries from official YARG v0.15.0.
  UPSTREAM_REPO: putudarma/YARG-DROID
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || '9bebad16e63cde7022a1fb7b261b541c1fae5361' }}
  PROJECT_DIR: project

jobs:
  tests:
    name: Automated tests (phone remote, guitar sound, singing, story, play-test song)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Make a test certificate
        run: bash android/remote/make-cert.sh "$RUNNER_TEMP/cert.bytes"
      - name: Run tests
        run: dotnet run --project tests/RemoteServerTests -c Release -- "$RUNNER_TEMP/cert.bytes" "$RUNNER_TEMP/demo"

      # The same checks the Android build runs before it builds, so a desktop build is never
      # made from code those tests reject. The singing tests and the song check use the game's
      # own source with this repo's patches applied (no art assets).
      - name: Get YARG source and its scoring engine
        run: |
          git init "$RUNNER_TEMP/up"
          git -C "$RUNNER_TEMP/up" remote add origin "https://github.com/$UPSTREAM_REPO"
          GIT_LFS_SKIP_SMUDGE=1 git -C "$RUNNER_TEMP/up" fetch -q --depth 1 origin "$UPSTREAM_REF"
          GIT_LFS_SKIP_SMUDGE=1 git -C "$RUNNER_TEMP/up" checkout -q FETCH_HEAD
          GIT_LFS_SKIP_SMUDGE=1 git -C "$RUNNER_TEMP/up" submodule update -q --init --depth 1 YARG.Core
          for p in patches/*.patch; do echo "Applying $p"; git -C "$RUNNER_TEMP/up" apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"; done
          for p in patches-core/*.patch; do echo "Applying $p to YARG.Core"; git -C "$RUNNER_TEMP/up/YARG.Core" apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"; done
      # Unity compiles these files as C# 9 against .NET Standard 2.1: catch anything newer here
      - name: Singing and story code only use what Unity has
        run: |
          dotnet build tests/VocalsApiCheck -c Release
          dotnet build tests/StoryApiCheck -c Release
      - name: Run singing tests (pitch detection, microphone timing, scoring, Challenge Mode)
        run: dotnet run --project tests/VocalsTests -c Release -p:YargProjectDir="$RUNNER_TEMP/up"
      - name: Run story mode tests
        run: dotnet run --project tests/StoryTests -c Release -- overlay/Assets/Resources/YargStory
      - name: Check the play-test song with the game's own song scanner
        run: |
          dotnet run --project tests/SmokeSongCheck -c Release -p:YargCore="$RUNNER_TEMP/up/YARG.Core" \
            -- "tests/smoke-song/Smoke Test - YARG Resurrected"

  windows:
    name: Unity Windows x64 build
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See README.md > Setup."
            exit 1
          fi

      - name: Get YARG source + submodules (LFS pulled separately so it can be cached)
        run: |
          git init "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          git remote add origin "https://github.com/$UPSTREAM_REPO"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth 1 origin "$UPSTREAM_REF"
          GIT_LFS_SKIP_SMUDGE=1 git checkout FETCH_HEAD
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --recursive --depth 1

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/.git/lfs
          key: yarg-lfs-${{ env.UPSTREAM_REF }}
          restore-keys: yarg-lfs-

      - name: Pull LFS assets
        run: |
          cd "$PROJECT_DIR"
          git lfs install --local
          git lfs pull

      - name: Apply patches, overlay and Windows libraries
        run: bash windows/prepare-project.sh "$PROJECT_DIR"

      - name: Restore NuGet packages
        run: |
          dotnet tool install --global NuGetForUnity.Cli
          nugetforunity restore "$PROJECT_DIR"

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/Library
          key: yarg-library-windows-${{ env.UPSTREAM_REF }}-${{ hashFiles('patches/**', 'overlay/**', 'windows/**') }}
          restore-keys: |
            yarg-library-windows-${{ env.UPSTREAM_REF }}-
            yarg-library-windows-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          targetPlatform: StandaloneWindows64
          buildMethod: YARG.Editor.Windows.YargWindowsBuild.Build
          buildName: YARG
          versioning: None
          allowDirtyBuild: true

      - name: Zip the game folder
        id: zip
        run: |
          exe="$(find build "$PROJECT_DIR/build" -name 'YARG.exe' 2>/dev/null | head -n1)"
          if [ -z "$exe" ]; then echo "::error::No YARG.exe produced"; exit 1; fi
          dir="$(dirname "$exe")"
          # Unity ran in a container as root, so the build folder (and its parent) belong to root
          sudo chown -R "$(id -u):$(id -g)" "$(dirname "$dir")"
          # Debug symbols and the burst debug folder aren't needed to play
          rm -rf "$dir"/*_BurstDebugInformation_DoNotShip "$dir"/*_BackUpThisFolder_ButDontShipItWithYourGame
          name="YARG-Resurrected-Windows-${{ github.run_number }}"
          cp -r "$dir" "$name"
          zip -qr "$name.zip" "$name"
          echo "file=$name.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: YARG-Resurrected-windows
          path: ${{ steps.zip.outputs.file }}

  play-test:
    name: Play test on Windows
    needs: [windows]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: YARG-Resurrected-windows
          path: dist
      - name: Virtual sound card (the song only moves on while its audio plays)
        uses: LABSN/sound-ci-helpers@v1
      # The play test opens a microphone the way a singer's profile does. On this machine
      # Windows' privacy switch for microphones is off ("access denied"), so turn it on for
      # desktop programs, as it is on a player's own PC.
      - name: Let desktop programs use the microphone
        shell: pwsh
        run: |
          $paths = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone",
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone",
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged"
          )
          foreach ($path in $paths) {
            try {
              if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
              Set-ItemProperty -Path $path -Name Value -Value Allow -ErrorAction Stop
              Write-Host "Microphone access allowed in $path"
            } catch {
              Write-Host "Could not change $path : $_"
            }
          }
      - name: Unpack the game
        run: |
          cd "$RUNNER_TEMP"
          unzip -q "$GITHUB_WORKSPACE/dist/"*.zip
          echo "GAME=$RUNNER_TEMP/$(ls -d YARG-Resurrected-Windows-*/ | head -n1)YARG.exe" >> "$GITHUB_ENV"
      - name: Start the game, play the test song with a bot, check the result
        run: bash tests/desktop-play-test.sh "$GAME" "$RUNNER_TEMP/play-test"
      - name: Keep the logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-test-windows
          path: ${{ runner.temp }}/play-test
          if-no-files-found: warn

  release:
    name: Publish (only after the play test passed)
    needs: [windows, play-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YARG-Resurrected-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: play-test-windows
          path: play-test
      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: YARG Resurrected for Windows, build ${{ github.run_number }}
          # The tag marks the commit this build was made from (not whatever main is at)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            dist/*
            play-test/menu.png
            play-test/phones.png
            play-test/song-setup.png
            play-test/gameplay.png
            play-test/result.txt
          body: |
            Play-tested on a GitHub Windows machine before publishing (screenshots and result.txt attached):
            the game started and reached the menu, a phone joined over the network as a guitarist and left
            again, a test song was scanned, Song Setup opened, and the song was played by a bot with the
            guitar sound generated for it.
            Windows (64-bit) build of YARG Resurrected from commit `${{ github.sha }}` (upstream
            `${{ env.UPSTREAM_REF }}`), with the same game as the Android build: guitar sound on notes,
            Song Setup, Deep Music Mode, vocals with Challenge Mode and sing-off, venues and crowd, story
            mode, menu music playlists, PS5 / Xbox / Switch gamepad layouts and phones as controllers and mics.
            Unzip the folder anywhere and run `YARG.exe`. See windows/README.md.
