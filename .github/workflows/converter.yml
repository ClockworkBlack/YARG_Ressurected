name: Build Converter APK

# YARG Converter: the companion app that turns MP3/WAV/FLAC files into YARG songs.
# Lives in converter/ and is completely separate from the game build (android.yml).

on:
  workflow_dispatch:
  push:
    paths:
      - "converter/**"
      - "tests/GameReaderCheck/**"
      - ".github/workflows/converter.yml"

permissions:
  contents: write

env:
  # Instrument-separation model: HT-Demucs 6-stem, ONNX conversion hosted on Hugging Face.
  # Pinned to one revision and one checksum; the app downloads and checks the same file.
  MODEL_URL: https://huggingface.co/StemSplitio/htdemucs-6s-onnx/resolve/49df9b6989cf2150840ea65b0bef77a2e471b678/htdemucs_6s_fp16weights.onnx
  MODEL_SHA256: 7ce55792e2231c93fbf92de95f5fd5b3a5e6c89f7db690dfd693e8f1dce56869
  ORT_VERSION: "1.31.1"
  # YARG.Core (the game's chart library) at the commit the game is built with: the submodule
  # pointer of putudarma/YARG-DROID at the commit android.yml builds.
  YARG_CORE_REF: 3beb94e526558134145bcd3e409428f759001a40

jobs:
  model:
    name: Real separation model through the app's code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Reuse the model file from an earlier run
        uses: actions/cache@v4
        with:
          path: model
          key: htdemucs-6s-fp16-${{ env.MODEL_SHA256 }}

      - name: Get the model and ONNX Runtime
        run: |
          mkdir -p model
          if [ ! -f model/htdemucs_6s.onnx ]; then
            curl -L --fail --retry 3 -o model/htdemucs_6s.onnx "$MODEL_URL"
          fi
          echo "$MODEL_SHA256  model/htdemucs_6s.onnx" | sha256sum -c
          curl -L --fail --retry 3 -o onnxruntime.jar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime/$ORT_VERSION/onnxruntime-$ORT_VERSION.jar"

      - name: Separate a test song and chart from the stems
        run: |
          javac -cp onnxruntime.jar -d out \
            $(find converter/app/src/main/java -path '*core*' -name '*.java') \
            converter/app/src/main/java/com/clockworkblack/yargconverter/stems/OrtStemModel.java \
            converter/core-test/*.java converter/model-test/*.java
          java -Xmx3g -cp out:onnxruntime.jar StemCheck model/htdemucs_6s.onnx

      # A real recording, to see what the whole conversion does on actual music:
      # "Sax, Rock, and Roll" by Kevin MacLeod (kit, bass, electric guitar, horns; 128 BPM),
      # Creative Commons BY-SA 3.0, from Wikimedia Commons.
      - name: Convert a real (Creative Commons) rock song
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          curl -L --fail --retry 3 -A "YARGConverter-CI/0.2 (https://github.com/ClockworkBlack/YARG_Ressurected)" \
            -o sample.ogg "https://upload.wikimedia.org/wikipedia/commons/0/0c/Kevin_MacLeod_-_Sax%2C_Rock%2C_and_Roll.ogg"
          ffmpeg -loglevel error -i sample.ogg -f f32le -ac 2 -ar 44100 sample.f32
          java -Xmx5g -cp out:onnxruntime.jar RealSongCheck model/htdemucs_6s.onnx sample.f32 \
            "sample-song/Kevin MacLeod - Sax, Rock, and Roll" "Sax, Rock, and Roll" "Kevin MacLeod"
          cp sample.ogg "sample-song/Kevin MacLeod - Sax, Rock, and Roll/song.ogg"
          printf '%s\n' '"Sax, Rock, and Roll" by Kevin MacLeod (incompetech.com).' \
            'Licensed under Creative Commons BY-SA 3.0: https://creativecommons.org/licenses/by-sa/3.0/' \
            'Audio from https://commons.wikimedia.org/wiki/File:Kevin_MacLeod_-_Sax,_Rock,_and_Roll.ogg' \
            'Charts made automatically by YARG Converter.' > "sample-song/Kevin MacLeod - Sax, Rock, and Roll/CREDITS.txt"

      # A real recording with singing, to see what the vocals side does on an actual voice:
      # "Swansong" by Josh Woodward (voice and acoustic guitar), Creative Commons BY 3.0, from
      # Wikimedia Commons. Time-synced lyrics are looked up the way the app does (LRCLIB); if
      # there are none, made-up lines still show whether the voice is heard and counted as sung.
      - name: Convert a real (Creative Commons) song with singing
        continue-on-error: true
        run: |
          curl -L --fail --retry 3 -A "YARGConverter-CI/0.2 (automated build check)" \
            -o sung.ogg "https://commons.wikimedia.org/wiki/Special:FilePath/Josh_Woodward_-_Swansong.ogg"
          ffmpeg -loglevel error -i sung.ogg -f f32le -ac 2 -ar 44100 sung.f32
          lyrics=""
          if curl -sS --fail --retry 2 -A "YARGConverter-CI/0.2 (automated build check)" \
               "https://lrclib.net/api/get?artist_name=Josh%20Woodward&track_name=Swansong" -o lrclib.json; then
            jq -r '.syncedLyrics // empty' lrclib.json > sung.lrc
            if [ -s sung.lrc ]; then lyrics="sung.lrc"; echo "Synced lyrics found: $(wc -l < sung.lrc) lines"; fi
          fi
          [ -z "$lyrics" ] && echo "No synced lyrics found; using made-up lines."
          java -Xmx5g -cp out:onnxruntime.jar RealSongCheck model/htdemucs_6s.onnx sung.f32 \
            "sample-song/Josh Woodward - Swansong" "Swansong" "Josh Woodward" $lyrics
          cp sung.ogg "sample-song/Josh Woodward - Swansong/song.ogg"
          [ -n "$lyrics" ] && cp sung.lrc "sample-song/Josh Woodward - Swansong/lyrics.lrc"
          printf '%s\n' '"Swansong" by Josh Woodward (joshwoodward.com).' \
            'Licensed under Creative Commons BY 3.0: https://creativecommons.org/licenses/by/3.0/' \
            'Audio from https://commons.wikimedia.org/wiki/File:Josh_Woodward_-_Swansong.ogg' \
            'Charts and vocals made automatically by YARG Converter.' > "sample-song/Josh Woodward - Swansong/CREDITS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: sample-song
          path: sample-song
          if-no-files-found: ignore

  game-reader:
    name: A converted song through the game's own song scanner and loader
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Write a test song (guitar, bass, two singers) with the converter
        working-directory: converter/core-test
        run: |
          javac -d out $(find ../app/src/main/java -path '*core*' -name '*.java') *.java
          java -cp out VocalTest write "$RUNNER_TEMP/song"

      - name: Get the game's chart library
        run: |
          git init yarg-core
          cd yarg-core
          git remote add origin https://github.com/YARC-Official/YARG.Core
          git fetch --depth 1 origin "$YARG_CORE_REF"
          git checkout FETCH_HEAD
          for p in "$GITHUB_WORKSPACE"/patches-core/*.patch; do echo "Applying $p"; git apply --whitespace=nowarn "$p"; done

      - name: Scan and load the song the way the game does
        run: |
          dotnet run --project tests/GameReaderCheck -c Release \
            -p:YargCore="$GITHUB_WORKSPACE/yarg-core" -- "$RUNNER_TEMP/song"

  apk:
    name: Converter APK
    # No APK is built or published unless the game itself can read what the converter writes.
    needs: game-reader
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the chart engine (beats, frets, repeats, chords, stems, vocals, song files)
        working-directory: converter/core-test
        run: |
          javac -d out $(find ../app/src/main/java -path '*core*' -name '*.java') *.java
          java -cp out CoreTest

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Use the shared signing key if one is set up
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/converter.keystore"
            echo "CONVERTER_KEYSTORE_FILE=$RUNNER_TEMP/converter.keystore" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: signing with a throwaway debug key."
          fi

      - name: Build APK
        env:
          CONVERTER_BUILD_NUMBER: ${{ github.run_number }}
          CONVERTER_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          CONVERTER_KEY_ALIAS: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          CONVERTER_KEY_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: gradle -p converter --no-daemon --stacktrace assembleDebug

      - name: Name the APK
        id: apk
        run: |
          out="YARG-Converter-${{ github.run_number }}.apk"
          cp converter/app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: YARG-Converter-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish as a GitHub release (easy download on your phone)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/combined-updates'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: converter-${{ github.run_number }}
          name: YARG Converter build ${{ github.run_number }}
          prerelease: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            Companion app for YARG Resurrected: pick an MP3, WAV or FLAC and it writes a
            ready-to-play song folder (guitar and bass Easy-Expert, beat map, vocals to sing) into
            `Internal storage/YARG/songs/Converted`.
            Download the .apk on your phone and open it to install.
